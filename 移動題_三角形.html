<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三角形移動練習 - 動態生成</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", "Heiti TC", sans-serif;
            background-color: #f0f4f8;
            padding: 20px;
            color: #333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .paper {
            width: 100%;
            max-width: 650px;
            background: white;
            padding: 30px;
            border: 1px solid #ddd;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border-radius: 8px;
            margin-top: 20px;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            border-bottom: 2px solid #2c3e50;
            padding-bottom: 10px;
            margin-bottom: 10px;
            font-size: 1.5em;
        }
        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 1.1em;
            background: #e8f4fd;
            padding: 10px 15px;
            border-radius: 6px;
        }
        .stat-item {
            font-weight: bold;
        }
        .instruction {
            text-align: center;
            font-size: 1em;
            color: #555;
            background: #f5f5f5;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        .question-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
        }
        .q-num {
            font-weight: bold;
            font-size: 1.3em;
            color: #2c3e50;
            margin-bottom: 15px;
        }
        .visuals {
            display: flex;
            align-items: center;
            gap: 30px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .shape-box {
            width: 180px;
            height: 180px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #fff;
            border: 0px solid #555;
            border-radius: 6px;
            padding: 10px;
            box-sizing: border-box;
        }
        .arrow {
            font-size: 2.5em;
            color: #999;
            font-weight: bold;
        }
        .label {
            font-size: 0.9em;
            color: #777;
            text-align: center;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .input-area {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        .input-label {
            font-size: 1.1em;
            font-weight: bold;
        }
        .input-box {
            width: 60px;
            height: 50px;
            font-size: 1.5em;
            text-align: center;
            border: 3px solid #555;
            border-radius: 8px;
            background: #fff;
            font-weight: bold;
        }
        .input-box:focus {
            outline: none;
            border-color: #3498db;
        }
        .btn-area {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        button {
            padding: 12px 30px;
            font-size: 1.1em;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-submit {
            background-color: #27ae60;
            color: white;
        }
        .btn-submit:hover {
            background-color: #219a52;
        }
        .btn-next {
            background-color: #3498db;
            color: white;
        }
        .btn-next:hover {
            background-color: #2980b9;
        }
        .btn-next:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }
        .feedback {
            text-align: center;
            font-size: 1.2em;
            font-weight: bold;
            padding: 15px;
            border-radius: 6px;
            margin-top: 20px;
            display: none;
        }
        .feedback.correct {
            background-color: #d4edda;
            color: #155724;
            display: block;
        }
        .feedback.wrong {
            background-color: #f8d7da;
            color: #721c24;
            display: block;
        }
        .progress-bar {
            width: 100%;
            height: 10px;
            background-color: #e0e0e0;
            border-radius: 5px;
            margin-top: 20px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background-color: #27ae60;
            width: 0%;
            transition: width 0.3s;
        }
        .triangle-count {
            font-size: 0.9em;
            color: #666;
            margin-top: 5px;
        }
        @media print {
            .btn-area, .progress-bar { display: none; }
        }
    </style>
</head>
<body>

<div class="paper">
    <h1>🔺 三角形移動練習</h1>
    
    <div class="stats">
        <span class="stat-item">題號：<span id="q-number">1</span></span>
        <span class="stat-item">答對：<span id="correct-count">0</span></span>
        <span class="stat-item">答錯：<span id="wrong-count">0</span></span>
    </div>
    
    <div class="instruction">
        左圖與右圖都是由 <strong>5 個小三角形</strong> 組成。<br>
        請找出左圖中「編號幾」的三角形，移動後可以變成右圖？
    </div>
    
    <div class="question-area">
        <div class="q-num">第 <span id="current-q">1</span> 題</div>
        
        <div class="visuals">
            <div>
                <div class="label">左圖</div>
                <div class="shape-box">
                    <svg id="left-svg" width="160" height="160" viewBox="0 0 160 160"></svg>
                </div>
                <div class="triangle-count">共 5 個三角形</div>
            </div>
            <div class="arrow">➜</div>
            <div>
                <div class="label">右圖</div>
                <div class="shape-box">
                    <svg id="right-svg" width="160" height="160" viewBox="0 0 160 160"></svg>
                </div>
                <div class="triangle-count">共 5 個三角形</div>
            </div>
        </div>
        
        <div class="input-area">
            <span class="input-label">答案：</span>
            <input type="text" class="input-box" id="answer-input" maxlength="1" placeholder="?">
        </div>
        
        <div class="btn-area">
            <button class="btn-submit" id="btn-submit" onclick="checkAnswer()">提交答案</button>
            <button class="btn-next" id="btn-next" onclick="generateQuestion()" disabled>下一題</button>
        </div>
        
        <div class="feedback" id="feedback"></div>
    </div>
    
    <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
    </div>
</div>

<script>
    // 遊戲狀態
    let currentQuestion = 1;
    let correctCount = 0;
    let wrongCount = 0;
    let currentAnswer = 0;
    let isAnswered = false;
    
    // 三角形網格配置 (基於等邊三角形網格)
    // 每個位置包含: {x, y, direction: 'up' or 'down'}
    const trianglePositions = [
        // 第1排 (1個向上)
        {id: 0, x: 60, y: 10, dir: 'up'},
        
        // 第2排 (2個向下, 1個向上)
        {id: 1, x: 40, y: 45, dir: 'down'},
        {id: 2, x: 60, y: 45, dir: 'up'},
        {id: 3, x: 80, y: 45, dir: 'down'},
        
        // 第3排 (2個向下, 2個向上)
        {id: 4, x: 20, y: 80, dir: 'down'},
        {id: 5, x: 40, y: 80, dir: 'up'},
        {id: 6, x: 60, y: 80, dir: 'down'},
        {id: 7, x: 80, y: 80, dir: 'up'},
        {id: 8, x: 100, y: 80, dir: 'down'},
        
        // 第4排 (3個向上)
        {id: 9, x: 30, y: 115, dir: 'up'},
        {id: 10, x: 60, y: 115, dir: 'up'},
        {id: 11, x: 90, y: 115, dir: 'up'},
        
        // 第5排 (2個向下)
        {id: 12, x: 45, y: 145, dir: 'down'},
        {id: 13, x: 75, y: 145, dir: 'down'}
    ];
    
    // 繪製單個三角形
    function drawTriangle(svg, x, y, dir, color, number = null) {
        const size = 25;
        let points;
        
        if (dir === 'up') {
            points = `${x},${y-size} ${x-size},${y+size} ${x+size},${y+size}`;
        } else {
            points = `${x},${y+size} ${x-size},${y-size} ${x+size},${y-size}`;
        }
        
        const polygon = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
        polygon.setAttribute('points', points);
        polygon.setAttribute('fill', color);
        polygon.setAttribute('stroke', '#333');
        polygon.setAttribute('stroke-width', '1.5');
        svg.appendChild(polygon);
        
        // 添加編號
        if (number !== null) {
            const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            text.setAttribute('x', x);
            text.setAttribute('y', y + 5);
            text.setAttribute('text-anchor', 'middle');
            text.setAttribute('fill', 'white');
            text.setAttribute('font-size', '14');
            text.setAttribute('font-weight', 'bold');
            text.textContent = number;
            svg.appendChild(text);
        }
    }
    
    // 生成隨機的5個三角形位置
    function generateShape() {
        let positions = [];
        while (positions.length < 5) {
            let pos = Math.floor(Math.random() * trianglePositions.length);
            if (!positions.includes(pos)) {
                positions.push(pos);
            }
        }
        return positions.sort((a, b) => a - b);
    }
    
    // 檢查三角形是否相連（共享邊）
    function isConnected(positions) {
        if (positions.length === 0) return false;
        
        // 定義相鄰關係（簡化版）
        const adjacency = {
            0: [1, 2, 3],
            1: [0, 2, 4, 5],
            2: [0, 1, 3, 5, 6],
            3: [0, 2, 6, 7],
            4: [1, 5, 9],
            5: [1, 2, 4, 6, 9, 10],
            6: [2, 3, 5, 7, 10, 11],
            7: [3, 6, 8, 11],
            8: [7, 11],
            9: [4, 5, 10, 12],
            10: [5, 6, 9, 11, 12, 13],
            11: [6, 7, 8, 10, 13],
            12: [9, 10, 13],
            13: [10, 11, 12]
        };
        
        let visited = new Set();
        let queue = [positions[0]];
        visited.add(positions[0]);
        
        while (queue.length > 0) {
            let current = queue.shift();
            let neighbors = adjacency[current] || [];
            
            for (let n of neighbors) {
                if (positions.includes(n) && !visited.has(n)) {
                    visited.add(n);
                    queue.push(n);
                }
            }
        }
        
        return visited.size === positions.length;
    }
    
    // 生成有效的5格形狀
    function generateValidShape() {
        let shape;
        let attempts = 0;
        do {
            shape = generateShape();
            attempts++;
        } while (!isConnected(shape) && attempts < 200);
        return shape;
    }
    
    // 渲染SVG圖形
    function renderSVG(svgElement, positions, showNumbers = false) {
        svgElement.innerHTML = '';
        
        positions.forEach((posIndex, i) => {
            let pos = trianglePositions[posIndex];
            let color = '#555555';
            let number = showNumbers ? (i + 1) : null;
            drawTriangle(svgElement, pos.x, pos.y, pos.dir, color, number);
        });
    }
    
    // 生成新題目
    function generateQuestion() {
        isAnswered = false;
        document.getElementById('answer-input').value = '';
        document.getElementById('answer-input').disabled = false;
        document.getElementById('btn-submit').disabled = false;
        document.getElementById('btn-next').disabled = true;
        document.getElementById('feedback').className = 'feedback';
        document.getElementById('feedback').textContent = '';
        document.getElementById('answer-input').focus();
        
        // 生成左圖形狀
        let leftShape = generateValidShape();
        
        // 隨機選擇一個三角形移動
        let moveIndex = Math.floor(Math.random() * 5);
        
        // 找到可以移動到的新位置
        let availablePositions = [];
        for (let i = 0; i < trianglePositions.length; i++) {
            if (!leftShape.includes(i)) {
                availablePositions.push(i);
            }
        }
        
        // 隨機選擇一個新位置
        let newPosition = availablePositions[Math.floor(Math.random() * availablePositions.length)];
        
        // 生成右圖形狀
        let rightShape = leftShape.filter(pos => pos !== leftShape[moveIndex]);
        rightShape.push(newPosition);
        rightShape.sort((a, b) => a - b);
        
        // 渲染左圖（帶編號）
        renderSVG(document.getElementById('left-svg'), leftShape, true);
        
        // 渲染右圖（不帶編號）
        renderSVG(document.getElementById('right-svg'), rightShape, false);
        
        // 記錄答案
        currentAnswer = moveIndex + 1;
        
        // 更新題號
        document.getElementById('current-q').textContent = currentQuestion;
        document.getElementById('q-number').textContent = currentQuestion;
        
        // 更新進度條
        let total = correctCount + wrongCount + 1;
        let progress = (correctCount / total) * 100;
        document.getElementById('progress-fill').style.width = progress + '%';
    }
    
    // 檢查答案
    function checkAnswer() {
        if (isAnswered) return;
        
        let userInput = document.getElementById('answer-input').value.trim();
        if (!userInput || userInput < 1 || userInput > 5) {
            alert('請輸入 1-5 之間的數字！');
            return;
        }
        
        isAnswered = true;
        document.getElementById('answer-input').disabled = true;
        document.getElementById('btn-submit').disabled = true;
        document.getElementById('btn-next').disabled = false;
        
        let feedback = document.getElementById('feedback');
        
        if (parseInt(userInput) === currentAnswer) {
            correctCount++;
            document.getElementById('correct-count').textContent = correctCount;
            feedback.textContent = '✅ 答對了！太棒了！';
            feedback.className = 'feedback correct';
        } else {
            wrongCount++;
            document.getElementById('wrong-count').textContent = wrongCount;
            feedback.textContent = '❌ 答錯了！正確答案是 ' + currentAnswer;
            feedback.className = 'feedback wrong';
        }
        
        // 更新進度條
        let total = correctCount + wrongCount;
        let progress = (correctCount / total) * 100;
        document.getElementById('progress-fill').style.width = progress + '%';
        
        // 自動聚焦到下一題按鈕
        document.getElementById('btn-next').focus();
    }
    
    // 支援 Enter 鍵提交
    document.getElementById('answer-input').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            if (!isAnswered) {
                checkAnswer();
            } else {
                generateQuestion();
            }
        }
    });
    
    // 初始化第一題
    generateQuestion();
</script>

</body>
</html>
